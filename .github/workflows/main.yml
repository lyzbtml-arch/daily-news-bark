

name: Daily News Bark

permissions:
  contents: read

concurrency:
  group: daily-news-bark
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天早上 8:00 = UTC 00:00
    - cron: "0 0 * * *"

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily news
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python main.py
